name: Windows PowerShell syntax check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse launcher with Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'PhoneControlLite.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List *
            exit 1
          }
          Write-Host "PhoneControlLite.ps1 parsed successfully with Windows PowerShell $($PSVersionTable.PSVersion)."
